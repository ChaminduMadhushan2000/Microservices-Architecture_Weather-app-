name: Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Docker Compose Services
      run: docker compose build

    - name: Start Services
      run: docker compose up -d

    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to start..."
        sleep 15

    - name: Health Check - Location Service
      run: |
        curl -f http://localhost:8080/api/location?city=London || exit 1

    - name: Health Check - Weather Service
      run: |
        curl -f "http://localhost:8080/api/weather?lat=51.5&lon=-0.1" || exit 1

    - name: Health Check - Frontend
      run: |
        curl -f http://localhost:8080/ || exit 1

    - name: Cleanup
      if: always()
      run: docker compose down --volumes