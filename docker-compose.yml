services:
  location-service:
    build: ./location-service
    expose:
      - "3001"
    networks:
      - weather-net
    restart: unless-stopped

  weather-service:
    build: ./weather-service
    expose:
      - "3002"
    networks:
      - weather-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    depends_on:
      - api-gateway
    networks:
      - weather-net
    restart: unless-stopped

  api-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - location-service
      - weather-service
    networks:
      - weather-net
    restart: unless-stopped

networks:
  weather-net: