version: '3.8'

services:
  location-service:
    build: ./location-service
    ports:
      - "3001:3001"
    networks:
      - weather-net

  weather-service:
    build: ./weather-service
    ports:
      - "3002:3002"
    networks:
      - weather-net

  api-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - location-service
      - weather-service
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge